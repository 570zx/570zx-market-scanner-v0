name: Final Frozen V0 Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-final.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify exact frozen ZIP
        shell: bash
        run: |
          set -euo pipefail
          {
            cat frozen6k/part00.b64 frozen6k/part01.b64 frozen6k/part02.b64 frozen6k/part03.b64 frozen6k/part04.b64 frozen6k/part05.b64 frozen6k/part06.b64
            cat frozenfix/p07_0.b64 frozenfix/p07_1.b64 frozenfix/p07_2.b64
            cat frozen6k/part08.b64 frozen6k/part09.b64 frozen6k/part10.b64 frozen6k/part11.b64 frozen6k/part12.b64 frozen6k/part13.b64
            cat frozenfix/p14_0.b64 frozenfix/p14_1.b64 frozenfix/p14_2.b64
            cat frozen6k/part15.b64 frozen6k/part16.b64 frozen6k/part17.b64 frozen6k/part18.b64
          } | base64 -d > zero_cost_market_scanner_v0_validated.zip
          echo '85fa5f4bae55ca378ca633f15fe7d431e3700bd2424a1fa0275a9108c7289fe8  zero_cost_market_scanner_v0_validated.zip' | sha256sum -c -
          unzip -q zero_cost_market_scanner_v0_validated.zip

      - name: Apply deployment validation fix only
        working-directory: market_scanner
        run: patch -p1 < ../deployment_fix/health-first-notice.patch

      - name: Package exact patched source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          base=root/'market_scanner'
          out=root/'zero_cost_market_scanner_v0_deployment_ready.zip'
          fixed=(2026,9,11,12,0,0)
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(base.rglob('*')):
                  if not p.is_file():
                      continue
                  rel=p.relative_to(root).as_posix()
                  data=p.read_bytes()
                  info=zipfile.ZipInfo(rel, fixed)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o644 & 0xFFFF) << 16
                  z.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY
          sha256sum zero_cost_market_scanner_v0_deployment_ready.zip

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install complete test dependencies
        working-directory: market_scanner
        run: pip install -e '.[dev]'

      - name: Complete test suite
        working-directory: market_scanner
        run: pytest -q

      - name: Compile entire patched tree
        working-directory: market_scanner
        run: python -m compileall -q .

      - name: Docker build --no-cache
        working-directory: market_scanner
        run: docker build --no-cache -t zero-cost-market-scanner:${{ github.sha }} .

      - name: Start container and verify host health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name scanner-ci -p 18080:8080 \
            -e ALPACA_API_KEY=ci-placeholder \
            -e ALPACA_API_SECRET=ci-placeholder \
            -e DISCOVERY_ENABLED=false \
            -e STREAM_ENABLED=false \
            -e OPTIONS_ENABLED=false \
            -e SEC_ENABLED=false \
            -e MACRO_ENABLED=false \
            -e DATABASE_PATH=/tmp/scanner.db \
            zero-cost-market-scanner:${{ github.sha }}
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:18080/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          docker logs scanner-ci
          exit 1

      - name: Verify health from inside container
        shell: bash
        run: |
          set -euo pipefail
          docker exec scanner-ci python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5) as r:
              data=json.load(r)
          assert data['ok'] is True, data
          print(json.dumps(data, sort_keys=True))
          PY

      - name: Verify Docker health status
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..45}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' scanner-ci)"
            echo "docker-health=$status"
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then docker logs scanner-ci; exit 1; fi
            sleep 2
          done
          docker inspect scanner-ci
          docker logs scanner-ci
          exit 1

      - name: Check runtime imports in container
        run: docker exec scanner-ci python -c "import app.main, app.persistence, app.scanner, app.providers.alpaca; print('runtime-imports-ok')"

      - name: Stop validation container
        if: always()
        run: docker rm -f scanner-ci || true

      - name: Upload exact deployment-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zero-cost-market-scanner-v0-deployment-ready
          path: zero_cost_market_scanner_v0_deployment_ready.zip
          if-no-files-found: error

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact passing image for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: market_scanner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v0-deployment-ready
            ghcr.io/${{ github.repository }}:${{ github.sha }}
