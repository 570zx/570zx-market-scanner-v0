name: Stock chart MCP deploy

# Deploys the stock-chart-mcp Worker. Manual trigger only:
# Actions -> "Stock chart MCP deploy" -> Run workflow.
#
# Uses the same repository secrets as MEDS deploy:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional repository secrets, copied into the Worker when present:
#   ALPACA_API_KEY, ALPACA_API_SECRET, STOCK_MCP_TOKEN (becomes MCP_TOKEN),
#   STOCK_ALERT_WEBHOOK_URL (becomes ALERT_WEBHOOK_URL)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stock-chart-mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stock-chart-mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stock-chart-mcp/package-lock.json
      - name: Check Cloudflare secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; missing=1; fi
          done
          exit $missing
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Deploy (schema migrations included)
        run: npm run deploy
      - name: Copy runtime secrets
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          MCP_TOKEN: ${{ secrets.STOCK_MCP_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.STOCK_ALERT_WEBHOOK_URL }}
        run: |
          for name in ALPACA_API_KEY ALPACA_API_SECRET MCP_TOKEN ALERT_WEBHOOK_URL; do
            if [ -n "${!name}" ]; then printf '%s' "${!name}" | npx --no-install wrangler secret put "$name"; else echo "skip $name (not set)"; fi
          done
      - name: Health check
        run: |
          sleep 10
          curl --fail --silent --show-error --max-time 20 https://stock-chart-mcp.sucharda-dodge.workers.dev/health
          echo
