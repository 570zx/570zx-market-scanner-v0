name: MEDS deploy

# Deploys the MEDS Worker (meds-scout-agent) to Cloudflare. Manual trigger only:
# Actions -> "MEDS deploy" -> Run workflow. Tests must pass first.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   an API token limited to this account with
#                          "Workers Scripts: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown on the Cloudflare dashboard
#
# Deploying does NOT switch live trading on: live execution stays off until
# /control/live/on is called, and Robinhood login is separate.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: meds-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: meds-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meds-scout/package-lock.json
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; missing=1; fi
          done
          exit $missing
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Deploy (schema migrations included)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Health check
        run: |
          sleep 10
          curl --fail --silent --show-error --max-time 20 https://meds-scout-agent.sucharda-dodge.workers.dev/health | tee /tmp/health.json
          echo
