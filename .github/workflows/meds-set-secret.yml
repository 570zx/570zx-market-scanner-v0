name: MEDS set secret

# Copies a GitHub repository secret of the same name into the MEDS Worker's own
# secrets on Cloudflare (so nobody has to use Cloudflare's dashboard menus).
# 1. Add the secret in GitHub: Settings -> Secrets and variables -> Actions.
# 2. Actions -> "MEDS set secret" -> Run workflow -> pick its name.
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (same as MEDS deploy).
# The value is never printed.

on:
  workflow_dispatch:
    inputs:
      secret:
        description: "Which secret to copy to the Worker"
        required: true
        type: choice
        options:
          - ADMIN_TOKEN
          - ALERT_WEBHOOK_URL

permissions:
  contents: read

concurrency:
  group: meds-set-secret
  cancel-in-progress: false

jobs:
  set-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: meds-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meds-scout/package-lock.json
      - run: npm ci
      - name: Copy the secret to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAME: ${{ inputs.secret }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          value="${!NAME:-}"
          if [ -z "$value" ]; then echo "::error::Repository secret $NAME is not set in GitHub"; exit 1; fi
          if [ "$NAME" = "ADMIN_TOKEN" ] && [ "${#value}" -lt 20 ]; then echo "::error::ADMIN_TOKEN must be at least 20 characters"; exit 1; fi
          printf '%s' "$value" | npx --no-install wrangler secret put "$NAME" --name meds-scout-agent >/dev/null
          echo "$NAME copied to the meds-scout-agent Worker"
