name: MEDS opening-range test

# Opening-range breakout test on the one-minute market days cached by MEDS backtest.
# Manual trigger. Run "MEDS backtest" at least once first so the cache exists.
# No Alpaca calls, so no secrets are needed.

on:
  workflow_dispatch: {}

permissions:
  contents: write # publishes the report to the backtest-results branch

concurrency:
  group: meds-orb
  cancel-in-progress: false

jobs:
  orb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meds-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore cached market data
        uses: actions/cache/restore@v4
        with:
          path: meds-scout/backtest/data
          key: meds-orb-unused-${{ github.run_id }}
          restore-keys: meds-backtest-data-v1-
      - name: Run opening-range test
        run: |
          set -euo pipefail
          node --disable-warning=ExperimentalWarning backtest/orb.mjs 2>&1 | tee orb-run.log
      - name: Show the error
        if: failure()
        run: echo "::error::$(tail -n 12 orb-run.log | cut -c1-300 | tr '\n' '|')"
      - name: Write job summary
        if: always()
        run: |
          if [ -f backtest/out-orb/summary.md ]; then cat backtest/out-orb/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "No report was produced." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meds-orb-${{ github.run_id }}
          path: meds-scout/backtest/out-orb
          if-no-files-found: ignore
      - name: Publish report to the backtest-results branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dest="runs/orb-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            work="$RUNNER_TEMP/results-$attempt"
            if git ls-remote --exit-code --heads "$remote" backtest-results >/dev/null 2>&1; then
              git clone --quiet --depth 1 --branch backtest-results "$remote" "$work"
            else
              git init --quiet -b backtest-results "$work"
              git -C "$work" remote add origin "$remote"
            fi
            mkdir -p "$work/$dest"
            cp -r backtest/out-orb/. "$work/$dest/"
            cp backtest/out-orb/summary.md "$work/ORB.md"
            git -C "$work" config user.name "meds-backtest"
            git -C "$work" config user.email "meds-backtest@users.noreply.github.com"
            git -C "$work" add -A
            git -C "$work" commit --quiet -m "MEDS opening-range test ${dest}"
            if git -C "$work" push --quiet origin HEAD:backtest-results; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not publish the report after 5 tries"; exit 1
