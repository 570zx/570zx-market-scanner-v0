name: APEX forward paper test (weak-close rule)

# PAPER ONLY. Forward test of the frozen APEX weak-close rule (accounts C and D; the rule is in
# apex/scripts/forward_test.py). It reads market data (GET requests only), replays the rule from its go-live
# date and commits a report and a ledger to the `apex-forward` branch. It places no orders and touches no
# broker account, Cloudflare Worker, or Robinhood connection.
#
# This file does nothing until it is on the default branch: scheduled and manual runs only start from there,
# and there is no push trigger. Merging it is what switches the test on.
#
# Runs after the close on weekdays (21:37 UTC is 16:37 or 17:37 in New York; the second run is a retry).
# The test is recomputed from the go-live date each time, so a repeated or late run changes nothing.
# Needs ALPACA_API_KEY and ALPACA_API_SECRET (read-only market data).

on:
  schedule:
    - cron: "37 21 * * 1-5"
    - cron: "37 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write # commits to the apex-forward branch only

concurrency:
  group: apex-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install --quiet "numpy>=2,<3" "pandas>=3,<4" "scipy>=1.13,<2" pytest
      - name: Self-test
        run: python3 -m pytest -q tests/test_forward.py
      - name: Check Alpaca secrets
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_API_SECRET" ]; then
            echo "::error::Add ALPACA_API_KEY and ALPACA_API_SECRET as repository secrets first."
            exit 1
          fi
      - name: Load the apex-forward branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" apex-forward >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch apex-forward "$remote" forward-state
          else
            git init --quiet -b apex-forward forward-state
            git -C forward-state remote add origin "$remote"
          fi
      - name: Run the forward paper test
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          set -euo pipefail
          python3 scripts/forward_test.py --fetch --out forward-state --previous forward-state/ledger.json > forward-run.log 2>&1 || { tail -n 12 forward-run.log | cut -c1-300; exit 1; }
      - name: Show the error
        if: failure()
        run: echo "::error::$(tail -n 12 forward-run.log 2>/dev/null | cut -c1-300 | tr '\n' '|')"
      - name: Write job summary
        if: always()
        run: |
          if [ -f forward-state/APEX-FORWARD.md ]; then cat forward-state/APEX-FORWARD.md >> "$GITHUB_STEP_SUMMARY"; else echo "No report this run." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit the report to the apex-forward branch
        if: success()
        run: |
          set -euo pipefail
          cd forward-state
          git config user.name "apex-forward"
          git config user.email "apex-forward@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit --quiet -m "APEX forward paper test $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git push --quiet origin HEAD:apex-forward; then exit 0; fi
            git pull --quiet --rebase origin apex-forward || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the apex-forward report after 5 tries"; exit 1
