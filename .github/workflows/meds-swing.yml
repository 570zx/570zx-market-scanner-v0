name: MEDS swing backtest

# Daily-bar swing-trading test: three simple strategies plus buy-and-hold SPY,
# replayed over years of real history for every liquid US stock. Manual trigger.
# Needs the same secrets as MEDS backtest (ALPACA_API_KEY, ALPACA_API_SECRET).
# Uses a slow request pace (45/min) so it can run next to other jobs.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day of history, YYYY-MM-DD (the first 210 sessions are warm-up)"
        required: true
        default: "2021-01-04"

permissions:
  contents: write # publishes the report to the backtest-results branch

concurrency:
  group: meds-swing
  cancel-in-progress: false

jobs:
  swing:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: meds-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Alpaca secrets
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_API_SECRET" ]; then
            echo "::error::Add ALPACA_API_KEY and ALPACA_API_SECRET as repository secrets first."
            exit 1
          fi
      - name: Restore cached market data
        uses: actions/cache/restore@v4
        with:
          path: meds-scout/backtest/data
          key: meds-swing-data-v1-${{ github.run_id }}
          restore-keys: meds-swing-data-v1-
      - name: Run swing backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          START: ${{ inputs.start }}
        run: |
          set -euo pipefail
          node --max-old-space-size=6000 --disable-warning=ExperimentalWarning backtest/swing.mjs --start "$START" --rpm 45 2>&1 | tee swing-run.log
      - name: Show the error
        if: failure()
        run: |
          # Put the end of the log in an annotation so it can be read without opening the logs.
          echo "::error::$(tail -n 12 swing-run.log | cut -c1-300 | tr '\n' '|')"
      - name: Save market data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: meds-scout/backtest/data
          key: meds-swing-data-v1-${{ github.run_id }}
      - name: Write job summary
        if: always()
        run: |
          if [ -f backtest/out-swing/summary.md ]; then cat backtest/out-swing/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "No report was produced; see the Run step." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meds-swing-${{ github.run_id }}
          path: meds-scout/backtest/out-swing
          if-no-files-found: ignore
      - name: Publish report to the backtest-results branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dest="runs/swing-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            work="$RUNNER_TEMP/results-$attempt"
            if git ls-remote --exit-code --heads "$remote" backtest-results >/dev/null 2>&1; then
              git clone --quiet --depth 1 --branch backtest-results "$remote" "$work"
            else
              git init --quiet -b backtest-results "$work"
              git -C "$work" remote add origin "$remote"
            fi
            mkdir -p "$work/$dest"
            cp -r backtest/out-swing/. "$work/$dest/"
            cp backtest/out-swing/summary.md "$work/SWING.md"
            git -C "$work" config user.name "meds-backtest"
            git -C "$work" config user.email "meds-backtest@users.noreply.github.com"
            git -C "$work" add -A
            git -C "$work" commit --quiet -m "MEDS swing backtest ${dest}"
            if git -C "$work" push --quiet origin HEAD:backtest-results; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not publish the report after 5 tries"; exit 1
