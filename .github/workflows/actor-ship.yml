name: Actor ship

# Ships one Actor to the owner's Apify account: unit tests, push + build, price and Store
# details from .actor/pricing.json and .actor/store.json, a real test run on Apify with
# .actor/test-input.json, and (if asked and the test run delivered results) makes it public.
# Owner-approved scope: publish at the prices in pricing.json, no spending, no outreach.
# Reports to actor-results/ship/<actor>.md.

on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Actor folder under actors/"
        required: true
      public:
        description: "Make it public in Apify Store if the test run passes"
        required: true
        default: "true"

permissions:
  contents: write

concurrency:
  group: actor-ship-${{ inputs.actor }}
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inputs and token
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ACTOR: ${{ inputs.actor }}
        run: |
          [ -n "$APIFY_TOKEN" ] || { echo "::error::APIFY_TOKEN secret missing"; exit 1; }
          [[ "$ACTOR" =~ ^[a-z0-9-]+$ ]] && [ -f "actors/$ACTOR/.actor/actor.json" ] || { echo "::error::No Actor folder actors/$ACTOR"; exit 1; }
      - name: Unit tests
        working-directory: actors/${{ inputs.actor }}
        run: npm install --no-audit --no-fund >/dev/null 2>&1 && npm test 2>&1 | tail -n 8 | tee "$RUNNER_TEMP/unit.txt"
      - name: Push and build
        working-directory: actors/${{ inputs.actor }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_CLI_DISABLE_TELEMETRY: "1"
        run: |
          set -o pipefail
          rm -rf node_modules storage
          npx --yes apify-cli@latest login --token "$APIFY_TOKEN" >/dev/null 2>&1 || { echo "Apify login failed" > "$RUNNER_TEMP/push.txt"; exit 1; }
          npx --yes apify-cli@latest push --force 2>&1 | grep -vE '^[0-9TZ:.-]+ #' | tail -n 14 | tee "$RUNNER_TEMP/push.txt"
          grep -q "Build: SUCCEEDED" "$RUNNER_TEMP/push.txt"
      - name: Price, Store details, platform test run, visibility
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ACTOR: ${{ inputs.actor }}
          PUBLIC: ${{ inputs.public }}
        run: python3 actors/ship.py "$ACTOR" 2>&1 | tee "$RUNNER_TEMP/ship.txt"
      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ inputs.actor }}
        run: |
          set -euo pipefail
          { echo "# ship $ACTOR $(date -u +%FT%TZ) ${GITHUB_SHA::7}"; for f in unit push ship; do echo "## $f"; echo '```'; cat "$RUNNER_TEMP/$f.txt" 2>/dev/null | sed 's/apify_api_[A-Za-z0-9]*/***/g'; echo '```'; done; } > "$RUNNER_TEMP/report.md"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            work="$RUNNER_TEMP/r-$attempt"
            git clone --quiet --depth 1 --branch actor-results "$remote" "$work"
            mkdir -p "$work/ship"; cp "$RUNNER_TEMP/report.md" "$work/ship/$ACTOR.md"
            git -C "$work" config user.name "actor-ship"; git -C "$work" config user.email "actor-ship@users.noreply.github.com"
            git -C "$work" add -A; git -C "$work" commit --quiet -m "ship $ACTOR" || true
            if git -C "$work" push --quiet origin HEAD:actor-results; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
