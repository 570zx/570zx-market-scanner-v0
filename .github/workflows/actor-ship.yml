name: Actor ship

# Ships Actors to the owner's Apify account, one after another: README check, unit tests,
# push + build, price and Store details (.actor/pricing.json, .actor/store.json), a real test
# run on Apify with .actor/test-input.json, and (if asked and the test run delivered results)
# makes each public. Owner-approved scope: publish at the prices in pricing.json, no spending,
# no outreach. Reports to actor-results/ship/<actor>.md.

on:
  workflow_dispatch:
    inputs:
      actors:
        description: "Actor folders under actors/, separated by spaces"
        required: true
      public:
        description: "Make each public in Apify Store if its test run passes"
        required: true
        default: "true"

permissions:
  contents: write

concurrency:
  group: actor-ship
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ship each Actor
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ACTORS: ${{ inputs.actors }}
          PUBLIC: ${{ inputs.public }}
          APIFY_CLI_DISABLE_TELEMETRY: "1"
        run: |
          set -u
          [ -n "$APIFY_TOKEN" ] || { echo "::error::APIFY_TOKEN secret missing"; exit 1; }
          npx --yes apify-cli@latest login --token "$APIFY_TOKEN" >/dev/null 2>&1 || { echo "::error::Apify login failed"; exit 1; }
          OUT="$RUNNER_TEMP/ship" actors/ship.sh $ACTORS
      - name: Publish reports
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ls "$RUNNER_TEMP/ship"/*.md >/dev/null 2>&1 || exit 0
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            work="$RUNNER_TEMP/r-$attempt"
            git clone --quiet --depth 1 --branch actor-results "$remote" "$work"
            mkdir -p "$work/ship"; cp "$RUNNER_TEMP"/ship/*.md "$work/ship/"
            git -C "$work" config user.name "actor-ship"; git -C "$work" config user.email "actor-ship@users.noreply.github.com"
            git -C "$work" add -A; git -C "$work" commit --quiet -m "ship reports" || true
            if git -C "$work" push --quiet origin HEAD:actor-results; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
