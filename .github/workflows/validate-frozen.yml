name: Validate Frozen V0

on:
  push:
    branches: [main]
    paths:
      - frozen6k/**
      - .github/workflows/validate-frozen.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact frozen ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat frozen6k/part*.b64 | base64 -d > zero_cost_market_scanner_v0_validated.zip
          echo '85fa5f4bae55ca378ca633f15fe7d431e3700bd2424a1fa0275a9108c7289fe8  zero_cost_market_scanner_v0_validated.zip' | sha256sum -c -
          unzip -q zero_cost_market_scanner_v0_validated.zip

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install complete test dependencies
        working-directory: market_scanner
        run: pip install -e '.[dev]'

      - name: Complete test suite
        working-directory: market_scanner
        run: pytest -q

      - name: Compile entire frozen tree
        working-directory: market_scanner
        run: python -m compileall -q .

      - name: Docker build --no-cache
        working-directory: market_scanner
        run: docker build --no-cache -t zero-cost-market-scanner:${{ github.sha }} .

      - name: Start container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name scanner-ci -p 18080:8080 \
            -e ALPACA_API_KEY=ci-placeholder \
            -e ALPACA_API_SECRET=ci-placeholder \
            -e DISCOVERY_ENABLED=false \
            -e STREAM_ENABLED=false \
            -e OPTIONS_ENABLED=false \
            -e SEC_ENABLED=false \
            -e MACRO_ENABLED=false \
            -e DATABASE_PATH=/tmp/scanner.db \
            zero-cost-market-scanner:${{ github.sha }}
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:18080/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          docker logs scanner-ci
          exit 1

      - name: Verify health from inside container
        shell: bash
        run: |
          set -euo pipefail
          docker exec scanner-ci python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5) as r:
              data=json.load(r)
          assert data['ok'] is True, data
          print(json.dumps(data, sort_keys=True))
          PY

      - name: Verify Docker health status and logs
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..40}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' scanner-ci)"
            echo "docker-health=$status"
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then docker logs scanner-ci; exit 1; fi
            sleep 2
          done
          docker inspect scanner-ci
          docker logs scanner-ci
          exit 1

      - name: Check runtime imports in container
        run: docker exec scanner-ci python -c "import app.main, app.persistence, app.scanner, app.providers.alpaca; print('runtime-imports-ok')"

      - name: Stop validation container
        if: always()
        run: docker rm -f scanner-ci || true

      - name: Upload exact validated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zero-cost-market-scanner-v0-validated
          path: zero_cost_market_scanner_v0_validated.zip
          if-no-files-found: error

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact passing image for amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: market_scanner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v0-validated
            ghcr.io/${{ github.repository }}:${{ github.sha }}

# canonical frozen6k transport complete
