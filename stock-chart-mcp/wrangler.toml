name = "stock-chart-mcp"
main = "src/index.ts"
compatibility_date = "2026-09-01"
keep_vars = true

# Watchlist watcher. It only does work on weekdays from 4:00 to 20:00 ET
# (9:30-16:00 with WATCH_EXTENDED_HOURS=false), measured on the data clock.
[triggers]
crons = ["*/5 * * * *"]

# No database_id: Wrangler provisions the D1 database on first deploy.
[[d1_databases]]
binding = "DB"
database_name = "stock-chart-mcp"
migrations_dir = "migrations"

[vars]
# SIP = consolidated tape (every US exchange). The free Alpaca plan serves SIP
# up to 15 minutes ago; set ALPACA_SIP_DELAY_MINUTES = "0" on a paid SIP plan.
ALPACA_FEED = "sip"
ALPACA_SIP_DELAY_MINUTES = "15"
WATCH_EXTENDED_HOURS = "true"

# Runtime secrets (Cloudflare > Worker > Settings > Variables and Secrets):
# ALPACA_API_KEY, ALPACA_API_SECRET  Alpaca keys (use a paper account's keys; only market data is read)
# MCP_TOKEN                          >= 24 random characters; part of the connector URL
# ALERT_WEBHOOK_URL                  optional Discord-style webhook for watcher alerts
